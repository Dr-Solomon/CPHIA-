<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>The Respiratory Threat Landscape in Africa | CPHIA 2026 3D Explorer</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts: Inter & JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <!-- Three.js & OrbitControls (r128 stable CDN) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'system-ui', 'sans-serif'],
            mono: ['JetBrains Mono', 'monospace'],
          },
          colors: {
            slateDark: '#060c14',
            tealDeep: '#091926',
            cyanGlow: '#22d3ee',
            emeraldGlow: '#10b981',
            coralGlow: '#f43f5e',
            amberGlow: '#f59e0b',
          }
        }
      }
    }
  </script>

  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #050a12;
      color: #f1f5f9;
      font-family: 'Inter', sans-serif;
    }

    #canvas-container {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      cursor: grab;
    }

    #canvas-container:active {
      cursor: grabbing;
    }

    /* Glassmorphism Utilities */
    .glass-panel {
      background: rgba(9, 19, 32, 0.72);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(56, 189, 248, 0.18);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.55), inset 0 1px 0 rgba(255, 255, 255, 0.08);
    }

    .glass-pill {
      background: rgba(15, 29, 46, 0.78);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(148, 163, 184, 0.16);
      transition: all 0.25s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .glass-pill:hover {
      background: rgba(20, 42, 66, 0.9);
      border-color: rgba(34, 211, 238, 0.45);
      transform: translateY(-1px);
    }

    .glass-pill.active {
      background: linear-gradient(135deg, rgba(14, 116, 144, 0.75), rgba(16, 185, 129, 0.35));
      border-color: #22d3ee;
      box-shadow: 0 0 20px rgba(34, 211, 238, 0.28);
      color: #ffffff;
    }

    /* Custom Scrollbar for HUD cards */
    .custom-scroll::-webkit-scrollbar {
      width: 5px;
      height: 5px;
    }
    .custom-scroll::-webkit-scrollbar-track {
      background: rgba(15, 23, 42, 0.3);
      border-radius: 10px;
    }
    .custom-scroll::-webkit-scrollbar-thumb {
      background: rgba(56, 189, 248, 0.35);
      border-radius: 10px;
    }
    .custom-scroll::-webkit-scrollbar-thumb:hover {
      background: rgba(56, 189, 248, 0.65);
    }

    /* Hide horizontal scrollbar on nav strip while keeping scrollability */
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }

    /* Pulse ring animation */
    @keyframes pulseGlow {
      0%, 100% { opacity: 0.75; transform: scale(1); }
      50% { opacity: 1; transform: scale(1.08); }
    }
    .pulse-dot {
      animation: pulseGlow 2.4s infinite ease-in-out;
    }

    /* Floating 3D Tooltip */
    #tooltip-3d {
      position: fixed;
      pointer-events: none;
      z-index: 40;
      transition: opacity 0.15s ease, transform 0.1s ease;
    }

    /* Subtle scanline vignette */
    .vignette-overlay {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 2;
      background: radial-gradient(circle at 50% 45%, transparent 55%, rgba(3, 7, 14, 0.72) 100%);
    }
  </style>
</head>
<body class="select-none">

  <!-- 3D WebGL Viewport -->
  <div id="canvas-container"></div>
  <div class="vignette-overlay"></div>

  <!-- 3D Raycast Hover Tooltip -->
  <div id="tooltip-3d" class="opacity-0 glass-panel rounded-xl px-3.5 py-2.5 max-w-xs border-cyan-400/40">
    <div id="tooltip-badge" class="text-[10px] font-mono uppercase tracking-wider text-cyan-300 mb-0.5">Node</div>
    <div id="tooltip-title" class="text-xs sm:text-sm font-semibold text-white leading-snug">Title</div>
    <div id="tooltip-desc" class="text-[11px] text-slate-300 mt-1 leading-relaxed">Details</div>
  </div>

  <!-- Top Header Bar -->
  <header class="fixed top-0 left-0 right-0 z-20 p-3 sm:p-4 pointer-events-none">
    <div class="max-w-7xl mx-auto flex flex-wrap items-center justify-between gap-2.5">
      <!-- Brand / Conference Identity -->
      <div class="glass-panel rounded-2xl px-3.5 py-2 sm:px-4 sm:py-2.5 pointer-events-auto flex items-center gap-3">
        <div class="w-9 h-9 rounded-xl bg-gradient-to-br from-cyan-500/30 to-emerald-500/30 border border-cyan-400/40 flex items-center justify-center shrink-0">
          <svg class="w-5 h-5 text-cyan-300" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M12 3v2m0 14v2m9-9h-2M5 12H3m15.364-6.364l-1.414 1.414M7.05 16.95l-1.414 1.414m12.728 0l-1.414-1.414M7.05 7.05L5.636 5.636M12 8a4 4 0 100 8 4 4 0 000-8z"/>
          </svg>
        </div>
        <div>
          <div class="flex items-center gap-2">
            <span class="inline-block w-2 h-2 rounded-full bg-emerald-400 pulse-dot"></span>
            <span class="text-[10px] sm:text-[11px] font-mono uppercase tracking-widest text-cyan-300">CPHIA 2026 • Addis Ababa, Ethiopia</span>
          </div>
          <h1 class="text-xs sm:text-sm md:text-base font-bold text-white tracking-tight leading-tight">
            The Respiratory Threat Landscape in Africa
          </h1>
        </div>
      </div>

      <!-- Right Controls: Auto-Tour, Reset Camera, Toggle HUD -->
      <div class="flex items-center gap-2 pointer-events-auto">
        <button id="btn-autotour" onclick="toggleAutoTour()" class="glass-pill rounded-xl px-3 py-2 text-xs font-medium text-slate-200 flex items-center gap-1.5 cursor-pointer" title="Guided Presentation Tour">
          <span id="tour-indicator" class="w-2 h-2 rounded-full bg-slate-400"></span>
          <span id="tour-label">Auto-Tour</span>
        </button>

        <button onclick="resetCameraView()" class="glass-pill rounded-xl p-2 text-slate-200 hover:text-cyan-300 cursor-pointer" title="Reset 3D Camera Angle">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/>
          </svg>
        </button>

        <button id="btn-toggle-hud" onclick="toggleHudPanel()" class="glass-pill rounded-xl px-3 py-2 text-xs font-medium text-cyan-300 flex items-center gap-1.5 cursor-pointer" title="Collapse/Expand Briefing Card">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/>
          </svg>
          <span class="hidden sm:inline" id="hud-toggle-text">Hide Panel</span>
        </button>
      </div>
    </div>
  </header>

  <!-- Main Interactive Information HUD Panel (Left/Bottom-Adaptive) -->
  <aside id="hud-panel" class="fixed z-20 left-3 right-3 sm:left-4 sm:right-auto top-20 sm:top-22 bottom-20 sm:bottom-24 sm:w-[410px] md:w-[440px] pointer-events-none flex flex-col justify-between transition-all duration-300">
    <div id="hud-card" class="glass-panel rounded-2xl p-4 sm:p-5 pointer-events-auto overflow-y-auto custom-scroll max-h-full flex flex-col gap-3.5">
      <!-- Dynamic Module Content Injected Here -->
    </div>
  </aside>

  <!-- Contextual Scene Controls Pill (Right Side / Above Bottom Bar) -->
  <div id="scene-controls-bar" class="fixed z-20 right-3 sm:right-4 bottom-20 sm:bottom-24 pointer-events-auto flex flex-col items-end gap-2">
    <!-- Dynamic scene-specific interactive buttons (e.g., Submerge Iceberg, Toggle Surveillance Gap) -->
  </div>

  <!-- Bottom Module Navigation Dock -->
  <nav class="fixed bottom-0 left-0 right-0 z-20 p-3 sm:p-4 pointer-events-none">
    <div class="max-w-5xl mx-auto flex items-center justify-center">
      <div class="glass-panel rounded-2xl p-1.5 pointer-events-auto flex items-center gap-1.5 overflow-x-auto no-scrollbar max-w-full">
        <button onclick="switchModule(0)" data-mod="0" class="mod-btn glass-pill active rounded-xl px-3 py-2 text-xs font-semibold whitespace-nowrap flex items-center gap-1.5 cursor-pointer">
          <span class="text-cyan-300 font-mono">01</span>
          <span>Overview</span>
        </button>
        <button onclick="switchModule(1)" data-mod="1" class="mod-btn glass-pill rounded-xl px-3 py-2 text-xs font-semibold text-slate-300 whitespace-nowrap flex items-center gap-1.5 cursor-pointer">
          <span class="text-cyan-300 font-mono">02</span>
          <span>Global Metrics</span>
        </button>
        <button onclick="switchModule(2)" data-mod="2" class="mod-btn glass-pill rounded-xl px-3 py-2 text-xs font-semibold text-slate-300 whitespace-nowrap flex items-center gap-1.5 cursor-pointer">
          <span class="text-rose-400 font-mono">03</span>
          <span>Missing Millions</span>
        </button>
        <button onclick="switchModule(3)" data-mod="3" class="mod-btn glass-pill rounded-xl px-3 py-2 text-xs font-semibold text-slate-300 whitespace-nowrap flex items-center gap-1.5 cursor-pointer">
          <span class="text-emerald-400 font-mono">04</span>
          <span>Economic Iceberg</span>
        </button>
        <button onclick="switchModule(4)" data-mod="4" class="mod-btn glass-pill rounded-xl px-3 py-2 text-xs font-semibold text-slate-300 whitespace-nowrap flex items-center gap-1.5 cursor-pointer">
          <span class="text-amber-400 font-mono">05</span>
          <span>Drivers & Risk</span>
        </button>
        <button onclick="switchModule(5)" data-mod="5" class="mod-btn glass-pill rounded-xl px-3 py-2 text-xs font-semibold text-slate-300 whitespace-nowrap flex items-center gap-1.5 cursor-pointer">
          <span class="text-emerald-300 font-mono">06</span>
          <span>Policy Pillars</span>
        </button>
      </div>
    </div>
  </nav>

  <!-- Subtle Interaction Hint Toast -->
  <div id="interaction-hint" class="fixed bottom-16 left-1/2 -translate-x-1/2 z-10 pointer-events-none text-[11px] font-mono text-slate-400/80 hidden md:block">
    Drag to orbit • Scroll to zoom • Click 3D nodes to inspect data
  </div>

  <script>
    /**
     * ============================================================================
     * THE RESPIRATORY THREAT LANDSCAPE IN AFRICA — 3D INTERACTIVE APPLICATION
     * Based on CPHIA 2026 Presentation by Awuor Nancy Otieno (KEMRI / ANISE)
     * ============================================================================
     */

    // --- GLOBAL STATE ---
    let scene, camera, renderer, controls, raycaster, mouse;
    let currentModule = 0;
    let clock = new THREE.Clock();
    let moduleGroups = [];
    let interactiveObjects = []; // Objects eligible for hover/click raycasting
    let animatedMixers = [];     // Custom per-frame animations
    let starfieldMesh;
    let hudVisible = true;
    let autoTourActive = false;
    let autoTourTimer = null;

    // Camera transition target state
    const camTargetPos = new THREE.Vector3(0, 3.5, 13);
    const camLookAtTarget = new THREE.Vector3(0, 0.5, 0);
    let isTransitioningCamera = false;

    // Interactive sub-states
    let showSurveillanceGap = false;
    let icebergSubmergedView = false;
    let icebergDepthRatio = 0.25; // 0 = above water, 1 = deep underwater

    // --- PRESENTATION DATA REPOSITORY (FROM SLIDES) ---
    const MODULES_DATA = [
      {
        id: 0,
        tag: "Module 01 • Keynote Briefing",
        title: "The Respiratory Threat Landscape in Africa",
        subtitle: "Influenza, RSV and COVID-19 burden, economic impact and policy implications",
        accent: "cyan",
        cameraPos: [0, 3.2, 12.5],
        lookAt: [-1.8, 0.3, 0],
        renderHTML: () => `
          <div class="space-y-3.5">
            <div class="inline-flex items-center gap-2 px-2.5 py-1 rounded-full bg-cyan-500/15 border border-cyan-400/30 text-cyan-300 text-[11px] font-mono">
              <span>CPHIA 2026 • November 24, 2026</span>
            </div>

            <div>
              <h2 class="text-lg sm:text-xl font-bold text-white leading-snug">
                The Respiratory Threat Landscape in Africa
              </h2>
              <p class="text-xs sm:text-sm text-cyan-200/90 mt-1 font-medium">
                Influenza, RSV and COVID-19 burden, economic impact and policy implications
              </p>
            </div>

            <!-- Speaker Card -->
            <div class="rounded-xl bg-slate-900/75 border border-slate-700/70 p-3.5 space-y-1.5">
              <div class="flex items-center justify-between">
                <span class="text-xs font-bold text-white">Awuor Nancy Otieno</span>
                <span class="text-[10px] font-mono px-2 py-0.5 rounded bg-emerald-500/20 text-emerald-300 border border-emerald-500/30">Keynote Speaker</span>
              </div>
              <p class="text-xs text-slate-300 leading-relaxed">
                Principal Research Scientist, <span class="text-white font-medium">Kenya Medical Research Institute (KEMRI)</span>, Centre for Global Health Research
              </p>
              <p class="text-xs text-cyan-300/90 font-medium">
                Executive Chair, African Network for Influenza Surveillance and Epidemiology (ANISE)
              </p>
              <div class="pt-1.5 border-t border-slate-800 flex items-center justify-between text-[11px] text-slate-400 font-mono">
                <span>Addis Ababa, Ethiopia</span>
                <span>Nov 24, 2026</span>
              </div>
            </div>

            <!-- 3 Pathogens Interactive Cards -->
            <div class="space-y-2">
              <div class="text-[11px] font-mono uppercase tracking-wider text-slate-400">Primary Viral Threats Visualized in 3D</div>
              <div class="grid grid-cols-3 gap-2">
                <button onclick="focusViralNode('rsv')" class="rounded-xl bg-rose-500/10 hover:bg-rose-500/20 border border-rose-500/30 p-2.5 text-left transition cursor-pointer">
                  <div class="w-2.5 h-2.5 rounded-full bg-rose-400 mb-1.5"></div>
                  <div class="text-xs font-bold text-white">RSV</div>
                  <div class="text-[10px] text-rose-200/80 leading-tight mt-0.5">~60% pediatric deaths in SSA</div>
                </button>
                <button onclick="focusViralNode('covid')" class="rounded-xl bg-cyan-500/10 hover:bg-cyan-500/20 border border-cyan-500/30 p-2.5 text-left transition cursor-pointer">
                  <div class="w-2.5 h-2.5 rounded-full bg-cyan-400 mb-1.5"></div>
                  <div class="text-xs font-bold text-white">COVID-19</div>
                  <div class="text-[10px] text-cyan-200/80 leading-tight mt-0.5">704.8M+ cases; hidden burden</div>
                </button>
                <button onclick="focusViralNode('flu')" class="rounded-xl bg-amber-500/10 hover:bg-amber-500/20 border border-amber-500/30 p-2.5 text-left transition cursor-pointer">
                  <div class="w-2.5 h-2.5 rounded-full bg-amber-400 mb-1.5"></div>
                  <div class="text-xs font-bold text-white">Influenza</div>
                  <div class="text-[10px] text-amber-200/80 leading-tight mt-0.5">Seasonal & zoonotic risk</div>
                </button>
              </div>
            </div>

            <div class="pt-1 flex items-center justify-between gap-2">
              <button onclick="switchModule(1)" class="w-full py-2.5 px-4 rounded-xl bg-gradient-to-r from-cyan-500 to-emerald-500 hover:from-cyan-400 hover:to-emerald-400 text-slate-950 font-bold text-xs shadow-lg shadow-cyan-500/25 transition cursor-pointer flex items-center justify-center gap-2">
                <span>Explore 3D Presentation Modules</span>
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2" d="M13 7l5 5m0 0l-5 5m5-5H6"/></svg>
              </button>
            </div>
          </div>
        `
      },
      {
        id: 1,
        tag: "Module 02 • Epidemiological Comparison",
        title: "Key Global Metrics: RSV vs. COVID-19",
        subtitle: "Disproportionate pediatric RSV mortality in Sub-Saharan Africa",
        accent: "rose",
        cameraPos: [0.5, 4.5, 13.5],
        lookAt: [-1.5, 1.5, 0],
        renderHTML: () => `
          <div class="space-y-3.5">
            <div>
              <span class="text-[11px] font-mono uppercase tracking-wider text-rose-400">Slide 02 • Key Global Metrics</span>
              <h2 class="text-lg font-bold text-white mt-0.5">RSV vs. COVID-19 Burden</h2>

            </div>

            <!-- Highlighted Alert Box from Slide 2 (Red Circle Emphasis) -->
            <div class="rounded-xl bg-gradient-to-r from-rose-500/20 to-amber-500/15 border border-rose-500/50 p-3">
              <div class="flex items-start gap-2.5">
                <div class="w-6 h-6 rounded-lg bg-rose-500/30 text-rose-300 flex items-center justify-center shrink-0 mt-0.5 font-bold text-xs">!</div>
                <div>
                  <div class="text-xs font-bold text-rose-200">Critical Geographic Disparity (RSV)</div>
                  <p class="text-xs text-white/95 mt-0.5 leading-relaxed">
                    <span class="font-bold text-rose-300">97% of pediatric deaths</span> occur in LMICs; <span class="font-bold text-amber-300 underline decoration-rose-400">~60% occur in Sub-Saharan Africa</span>.
                  </p>
                </div>
              </div>
            </div>

            <!-- Comparative Data Breakdown -->
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-2.5">
              <!-- RSV Column -->
              <div class="rounded-xl bg-slate-900/75 border border-rose-500/30 p-3 space-y-2">
                <div class="flex items-center justify-between border-b border-slate-800 pb-1.5">
                  <span class="text-xs font-bold text-rose-300">RSV (Annual)</span>
                  <span class="text-[10px] font-mono bg-rose-500/20 text-rose-200 px-1.5 py-0.5 rounded">35.78% Attack</span>
                </div>
                <ul class="text-[11px] text-slate-300 space-y-1.5 leading-snug">
                  <li><strong class="text-white">Acute LRI:</strong> ~33.0 million cases</li>
                  <li><strong class="text-white">Hospitalizations:</strong> ~3.6M globally (160k ≥65 yrs U.S.)</li>
                  <li><strong class="text-white">Mortality:</strong> ~100,000 deaths (~26,300 in-hospital; ~50% in &lt;6 months; 10,000 in ≥65 yrs)</li>
                  <li><strong class="text-rose-300">Attack Rate:</strong> Pooled 35.78% (higher in neonatal/pediatric wards)</li>
                </ul>
              </div>

              <!-- COVID-19 Column -->
              <div class="rounded-xl bg-slate-900/75 border border-cyan-500/30 p-3 space-y-2">
                <div class="flex items-center justify-between border-b border-slate-800 pb-1.5">
                  <span class="text-xs font-bold text-cyan-300">COVID-19</span>
                  <span class="text-[10px] font-mono bg-cyan-500/20 text-cyan-200 px-1.5 py-0.5 rounded">4% Attack</span>
                </div>
                <ul class="text-[11px] text-slate-300 space-y-1.5 leading-snug">
                  <li><strong class="text-white">Confirmed Cases:</strong> ~704.8 million+ cumulative</li>
                  <li><strong class="text-white">Excess Mortality:</strong> ~18 million deaths globally</li>
                  <li><strong class="text-white">Peak Rank:</strong> #1 in 2021 (~16,500 daily deaths Jan 2021), dropping to #20 by 2023</li>
                  <li><strong class="text-cyan-300">Age Skew:</strong> Older adults 82% of reported deaths</li>
                </ul>
              </div>
            </div>

            <div class="text-[10px] text-slate-400 leading-tight border-t border-slate-800 pt-2">
              Sources: Duan Q, et al. <em>eClinicalMedicine</em> (1960–2025); WHO COVID-19 Dashboards; Trop Med Infect Dis 2025.
            </div>
          </div>
        `
      },
      {
        id: 2,
        tag: "Module 03 • Surveillance Discrepancy",
        title: "The Missing Millions (2020–2022)",
        subtitle: "Uncovering the Burden of COVID-19 Cases and Deaths in Africa",
        accent: "coral",
        cameraPos: [0, 5.2, 13.5],
        lookAt: [-1.5, 1.8, 0],
        renderHTML: () => `
          <div class="space-y-3.5">
            <div>
              <span class="text-[11px] font-mono uppercase tracking-wider text-rose-400">Slide 03 • Epidemiological Curve</span>
              <h2 class="text-lg font-bold text-white mt-0.5">The Missing Millions in Africa</h2>
              <p class="text-xs text-slate-300 mt-1">
                Reported new COVID-19 cases per million (Jan 2020 – Jul 2022) show an artificially flat red line for Africa compared to massive Omicron peaks in Europe & Asia (~2,400/million).
              </p>
            </div>

            <!-- Interactive Toggle for Surveillance Gap -->
            <div class="rounded-xl bg-slate-900/80 border border-cyan-500/30 p-3 flex items-center justify-between gap-3">
              <div>
                <div class="text-xs font-bold text-white">Reveal Estimated Surveillance Gap</div>
                <div class="text-[11px] text-slate-400">Project underreported true community transmission</div>
              </div>
              <button onclick="toggleSurveillanceGapModel()" id="btn-gap-toggle" class="px-3 py-1.5 rounded-lg text-xs font-bold transition cursor-pointer ${showSurveillanceGap ? 'bg-rose-500 text-white shadow-lg shadow-rose-500/30' : 'bg-slate-800 text-cyan-300 border border-cyan-500/40'}">
                ${showSurveillanceGap ? 'Gap Visible' : 'Show Gap'}
              </button>
            </div>

            <!-- Key Insights Callout Box from Slide 3 -->
            <div class="space-y-2">
              <div class="rounded-xl bg-rose-500/15 border border-rose-500/35 p-3">
                <div class="text-xs font-bold text-rose-300 flex items-center gap-1.5">
                  <span class="w-2 h-2 rounded-full bg-rose-400"></span>
                  Surveillance Limitations = Substantial Underreporting
                </div>
                <p class="text-[11px] text-slate-300 mt-1 leading-relaxed">
                  Limited diagnostic testing capacity and passive reporting masked millions of infections across the African region.
                </p>

    function createAmbientParticles() {
      const count = 900;
      const geometry = new THREE.BufferGeometry();
      const positions = new Float32Array(count * 3);
      const colors = new Float32Array(count * 3);

      const c1 = new THREE.Color(0x22d3ee);
      const c2 = new THREE.Color(0x10b981);
      const c3 = new THREE.Color(0xf43f5e);

      for (let i = 0; i < count; i++) {
        positions[i * 3] = (Math.random() - 0.5) * 45;
        positions[i * 3 + 1] = (Math.random() - 0.5) * 35;
        positions[i * 3 + 2] = (Math.random() - 0.5) * 45;

        const pick = Math.random();
        const col = pick < 0.55 ? c1 : (pick < 0.85 ? c2 : c3);
        colors[i * 3] = col.r;
        colors[i * 3 + 1] = col.g;
        colors[i * 3 + 2] = col.b;
      }

      geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
      geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));

      const material = new THREE.PointsMaterial({
        size: 0.11,
        vertexColors: true,
        transparent: true,
        opacity: 0.65,
        blending: THREE.AdditiveBlending
      });

      starfieldMesh = new THREE.Points(geometry, material);
      scene.add(starfieldMesh);
    }

    // --- HELPER: CREATE 3D SPRITE LABEL ---
    function createTextSprite(text, subtext = "", colorHex = "#22d3ee") {
      const canvas = document.createElement('canvas');
      canvas.width = 512;
      canvas.height = 160;
      const ctx = canvas.getContext('2d');

      // Pill background
      ctx.fillStyle = "rgba(6, 14, 26, 0.82)";
      ctx.strokeStyle = colorHex;
      ctx.lineWidth = 4;
      roundRect(ctx, 16, 16, 480, 128, 28);
      ctx.fill();
      ctx.stroke();

      // Title
      ctx.fillStyle = "#ffffff";
      ctx.font = "bold 34px Inter, sans-serif";
      ctx.textAlign = "center";
      ctx.fillText(text, 256, subtext ? 72 : 92);

      // Subtext
      if (subtext) {
        ctx.fillStyle = colorHex;
        ctx.font = "600 24px JetBrains Mono, monospace";
        ctx.fillText(subtext, 256, 114);
      }

      const texture = new THREE.CanvasTexture(canvas);
      const material = new THREE.SpriteMaterial({ map: texture, transparent: true });
      const sprite = new THREE.Sprite(material);
      sprite.scale.set(3.2, 1.0, 1);
      return sprite;
    }

    function roundRect(ctx, x, y, w, h, r) {
      ctx.beginPath();
      ctx.moveTo(x + r, y);
      ctx.arcTo(x + w, y, x + w, y + h, r);
      ctx.arcTo(x + w, y + h, x, y + h, r);
      ctx.arcTo(x, y + h, x, y, r);
      ctx.arcTo(x, y, x + w, y, r);
      ctx.closePath();
    }

    // --- HELPER: BUILD STYLISED VIRION MESH ---
    function createVirionMesh(radius, colorHex, spikeCount = 24) {
      const group = new THREE.Group();
      const coreGeo = new THREE.IcosahedronGeometry(radius, 2);
      const coreMat = new THREE.MeshStandardMaterial({
        color: colorHex,
        emissive: colorHex,
        emissiveIntensity: 0.35,
        roughness: 0.3,
        metalness: 0.2,
        wireframe: false
      });
      const core = new THREE.Mesh(coreGeo, coreMat);
      group.add(core);

      // Wireframe shell
      const wireGeo = new THREE.IcosahedronGeometry(radius * 1.06, 1);
      const wireMat = new THREE.MeshBasicMaterial({
        color: 0xffffff,
        wireframe: true,
        transparent: true,
        opacity: 0.22
      });
      group.add(new THREE.Mesh(wireGeo, wireMat));

      // Surface Glycoprotein Spikes
      const spikeGeo = new THREE.CylinderGeometry(radius * 0.04, radius * 0.08, radius * 0.42, 6);
      const tipGeo = new THREE.SphereGeometry(radius * 0.11, 8, 8);
      const spikeMat = new THREE.MeshStandardMaterial({
        color: 0xffffff,
        emissive: colorHex,
        emissiveIntensity: 0.6
      });

      const phi = Math.PI * (3 - Math.sqrt(5));
      for (let i = 0; i < spikeCount; i++) {
        const y = 1 - (i / (spikeCount - 1)) * 2;
        const r = Math.sqrt(1 - y * y);
        const theta = phi * i;
        const dir = new THREE.Vector3(Math.cos(theta) * r, y, Math.sin(theta) * r).normalize();

        const spike = new THREE.Mesh(spikeGeo, spikeMat);
        spike.position.copy(dir).multiplyScalar(radius * 1.15);
        spike.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), dir);
        group.add(spike);

        const tip = new THREE.Mesh(tipGeo, spikeMat);
        tip.position.copy(dir).multiplyScalar(radius * 1.38);
        group.add(tip);
      }
      return group;
    }

          color: 0x22d3ee,
          title: "2. Vaccines & Antivirals",
          sub: "RSV mAbs & Seasonal Flu",
          badge: "Policy Pillar 02",
          desc: "Seasonal influenza uptake in high-risk groups; maternal RSV vaccines & long-acting monoclonal antibodies; maintaining COVID-19 vaccination."
        },
        {
          x: 3.1,
          color: 0xf59e0b,
          title: "3. Zoonotic Readiness",
          sub: "Regional Manufacturing",
          badge: "Policy Pillar 03",
          desc: "Investing in pandemic preparedness and building regional vaccine manufacturing capacity across Africa."
        }
      ];

      const beaconOrbs = [];
      pillars.forEach((p) => {
        // Fluted Cylinder Column
        const colGeo = new THREE.CylinderGeometry(0.68, 0.78, 4.35, 16);
        const colMat = new THREE.MeshStandardMaterial({
          color: p.color,
          emissive: p.color,
          emissiveIntensity: 0.3,
          roughness: 0.25,
          metalness: 0.35,
          transparent: true,
          opacity: 0.9
        });
        const colMesh = new THREE.Mesh(colGeo, colMat);
        colMesh.position.set(p.x, 0.72, 0);
        colMesh.userData = {
          module: 5,
          badge: p.badge,
          title: p.title,
          desc: p.desc
        };
        interactiveObjects.push(colMesh);
        group.add(colMesh);

        // Orbiting Energy Ring around each Pillar
        const orb = new THREE.Mesh(
          new THREE.TorusGeometry(1.05, 0.04, 12, 40),
          new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.65 })
        );
        orb.rotation.x = Math.PI / 2;
        orb.position.set(p.x, 0.72, 0);
        group.add(orb);
        beaconOrbs.push(orb);

        const lbl = createTextSprite(p.title, p.sub, `#${p.color.toString(16).padStart(6, '0')}`);
        lbl.position.set(p.x, -2.25, 1.3);
        lbl.scale.set(2.7, 0.85, 1);
        group.add(lbl);
      });

      animatedMixers.push((t) => {
        if (!group.visible) return;
        beaconOrbs.forEach((orb, i) => {
          orb.position.y = 0.72 + Math.sin(t * 1.8 + i * 1.5) * 1.65;
        });
      });

      return group;
    }

    // --- NAVIGATION & INTERACTIVITY CONTROLLERS ---
    function switchModule(index) {
      currentModule = index;

      // Toggle 3D Scene Group Visibility
      moduleGroups.forEach((grp, idx) => {
        grp.visible = (idx === index);
      });

      // Update Bottom Dock Active States
      document.querySelectorAll('.mod-btn').forEach((btn) => {
        const modIdx = parseInt(btn.getAttribute('data-mod'), 10);
        if (modIdx === index) {
          btn.classList.add('active');
          btn.classList.remove('text-slate-300');
        } else {
          btn.classList.remove('active');
          btn.classList.add('text-slate-300');
        }
      });

      // Render HUD Card Content
      const modData = MODULES_DATA[index];
      document.getElementById('hud-card').innerHTML = modData.renderHTML();

      // Update Contextual Scene Controls on Bottom-Right
      renderContextualControls(index);

      // Smooth Camera Flight
      const isMobile = window.innerWidth < 640;
      const pos = modData.cameraPos;
      const look = modData.lookAt;
      camTargetPos.set(isMobile ? 0 : pos[0], pos[1], isMobile ? pos[2] + 2.5 : pos[2]);
      camLookAtTarget.set(isMobile ? 0 : look[0], look[1], look[2]);
      isTransitioningCamera = true;
    }

    function renderContextualControls(index) {
      const container = document.getElementById('scene-controls-bar');
      container.innerHTML = '';

      if (index === 2) {
        // Missing Millions: Quick Surveillance Gap Pill
        container.innerHTML = `
          <button onclick="toggleSurveillanceGapModel()" class="glass-pill rounded-xl px-3.5 py-2 text-xs font-semibold ${showSurveillanceGap ? 'border-rose-400 text-rose-300 bg-rose-950/70' : 'text-cyan-300'} flex items-center gap-2 cursor-pointer shadow-lg">
            <span class="w-2 h-2 rounded-full ${showSurveillanceGap ? 'bg-rose-400 pulse-dot' : 'bg-cyan-400'}"></span>
            <span>${showSurveillanceGap ? 'Hide True Burden Gap' : 'Reveal Missing Millions Gap'}</span>
          </button>
        `;
      } else if (index === 3) {
        // Economic Iceberg: Quick Dive Pill
        container.innerHTML = `
          <button onclick="toggleIcebergDive()" class="glass-pill rounded-xl px-3.5 py-2 text-xs font-semibold text-emerald-300 flex items-center gap-2 cursor-pointer shadow-lg">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 14l-7 7m0 0l-7-7m7 7V3"/></svg>
            <span>${icebergSubmergedView ? 'Ascend to 10% Tip' : 'Submerge to 90% Depth'}</span>
          </button>
        `;
      }
    }

    function focusViralNode(viralId) {
      const map = {
        rsv: { pos: [-1.5, 2.2, 7.5], look: [-1.2, 1.5, 1.4] },
        covid: { pos: [5.2, 2.0, 7.5], look: [5.0, 1.2, 1.2] },
        flu: { pos: [2.2, -1.8, 7.8], look: [2.2, -2.5, 1.9] }
      };
      if (map[viralId]) {
        camTargetPos.set(...map[viralId].pos);
        camLookAtTarget.set(...map[viralId].look);
        isTransitioningCamera = true;
      }
    }

    function toggleSurveillanceGapModel() {
      showSurveillanceGap = !showSurveillanceGap;
      if (surveillanceGapMesh) surveillanceGapMesh.visible = showSurveillanceGap;
      if (surveillanceGapLabel) surveillanceGapLabel.visible = showSurveillanceGap;
      // Refresh HUD & contextual pill
      document.getElementById('hud-card').innerHTML = MODULES_DATA[2].renderHTML();
      renderContextualControls(2);
    }

    function toggleIcebergDive() {
      icebergSubmergedView = !icebergSubmergedView;
      icebergDepthRatio = icebergSubmergedView ? 0.85 : 0.15;
      applyIcebergCameraDepth();
      document.getElementById('hud-card').innerHTML = MODULES_DATA[3].renderHTML();
      renderContextualControls(3);
    }

    function setIcebergDepth(val) {
      icebergDepthRatio = parseInt(val, 10) / 100;
      icebergSubmergedView = icebergDepthRatio > 0.5;
      applyIcebergCameraDepth();
    }

    function applyIcebergCameraDepth() {
      const yPos = 2.6 - icebergDepthRatio * 5.8; // +2.6 above water down to -3.2 underwater
      const yLook = 0.6 - icebergDepthRatio * 3.4;
      camTargetPos.set(0, yPos, 12.5);
      camLookAtTarget.set(window.innerWidth >= 640 ? -1.2 : 0, yLook, 0);
      isTransitioningCamera = true;
    }

    function resetCameraView() {
      switchModule(currentModule);
    }

    function toggleHudPanel() {
      hudVisible = !hudVisible;
      const panel = document.getElementById('hud-panel');
      const label = document.getElementById('hud-toggle-text');
      if (hudVisible) {
        panel.style.opacity = '1';
        panel.style.transform = 'translateX(0)';
        panel.classList.remove('pointer-events-none');
        if (label) label.textContent = 'Hide Panel';
      } else {
        panel.style.opacity = '0';
        panel.style.transform = 'translateX(-24px)';
        if (label) label.textContent = 'Show Panel';
      }
    }

    function toggleAutoTour() {
      autoTourActive = !autoTourActive;
      const indicator = document.getElementById('tour-indicator');
      const label = document.getElementById('tour-label');

      if (autoTourActive) {
        indicator.classList.remove('bg-slate-400');
        indicator.classList.add('bg-emerald-400', 'pulse-dot');
        label.textContent = 'Touring...';
        autoTourTimer = setInterval(() => {
          const next = (currentModule + 1) % MODULES_DATA.length;
          switchModule(next);
        }, 8500);
      } else {
        indicator.classList.add('bg-slate-400');
        indicator.classList.remove('bg-emerald-400', 'pulse-dot');
        label.textContent = 'Auto-Tour';
        clearInterval(autoTourTimer);
      }
    }

    // --- RAYCASTING (HOVER TOOLTIP & CLICK INSPECTION) ---
    function onPointerMove(event) {
      mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
      mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

      const tooltip = document.getElementById('tooltip-3d');
      raycaster.setFromCamera(mouse, camera);

      // Filter only objects belonging to active module
      const activeHits = interactiveObjects.filter(obj => obj.userData.module === currentModule);
      const intersects = raycaster.intersectObjects(activeHits, false);

      if (intersects.length > 0) {
        const hitData = intersects[0].object.userData;
        document.body.style.cursor = 'pointer';
        document.getElementById('tooltip-badge').textContent = hitData.badge || 'Data Node';
        document.getElementById('tooltip-title').textContent = hitData.title || '';
        document.getElementById('tooltip-desc').textContent = hitData.desc || '';

        // Keep tooltip inside viewport bounds
        const pad = 16;
        const left = Math.min(window.innerWidth - 330, event.clientX + pad);
        const top = Math.min(window.innerHeight - 130, event.clientY + pad);
        tooltip.style.left = `${Math.max(12, left)}px`;
        tooltip.style.top = `${Math.max(12, top)}px`;
        tooltip.style.opacity = '1';
      } else {
        document.body.style.cursor = 'grab';
        tooltip.style.opacity = '0';
      }
    }

    function onCanvasClick(event) {
      // Ignore clicks on UI elements
      if (event.target.closest('button') || event.target.closest('#hud-card') || event.target.closest('nav')) return;

      raycaster.setFromCamera(mouse, camera);
      const activeHits = interactiveObjects.filter(obj => obj.userData.module === currentModule);
      const intersects = raycaster.intersectObjects(activeHits, false);

      if (intersects.length > 0) {
        const data = intersects[0].object.userData;
        if (data.viralId) {
          focusViralNode(data.viralId);
        }
        // Highlight selected item inside HUD
        const hudCard = document.getElementById('hud-card');
        const existingPin = document.getElementById('pinned-inspector');
        if (existingPin) existingPin.remove();

        const pin = document.createElement('div');
        pin.id = 'pinned-inspector';
        pin.className = 'rounded-xl bg-cyan-500/20 border border-cyan-400 p-3 animate-pulse';
        pin.innerHTML = `
          <div class="flex items-center justify-between">
            <span class="text-[10px] font-mono uppercase text-cyan-300">${data.badge}</span>
            <button onclick="this.parentElement.parentElement.remove()" class="text-xs text-slate-300 hover:text-white cursor-pointer">✕</button>
          </div>
          <div class="text-xs font-bold text-white mt-0.5">${data.title}</div>
          <p class="text-[11px] text-slate-200 mt-1">${data.desc}</p>
        `;
        hudCard.prepend(pin);
        setTimeout(() => pin.classList.remove('animate-pulse'), 1000);
      }
    }

    function onWindowResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);

      const offsetX = window.innerWidth >= 640 ? 2.1 : 0;
      moduleGroups.forEach(grp => {
        grp.position.x = offsetX;
      });
    }

    // --- MAIN RENDER & ANIMATION LOOP ---
    function animateLoop() {
      requestAnimationFrame(animateLoop);
      const elapsedTime = clock.getElapsedTime();

      // Rotate ambient bio-particles slowly
      if (starfieldMesh) {
        starfieldMesh.rotation.y = elapsedTime * 0.025;
      }

      // Run active module animations
      animatedMixers.forEach(fn => fn(elapsedTime));

      // Smooth Camera Interpolation
      if (isTransitioningCamera) {
        camera.position.lerp(camTargetPos, 0.055);
        controls.target.lerp(camLookAtTarget, 0.055);
        if (camera.position.distanceTo(camTargetPos) < 0.05) {
          isTransitioningCamera = false;
        }
      }

      controls.update();
      renderer.render(scene, camera);
    }
  </script>
</body>
